name: Frontend Deploy

on:
  workflow_call:

jobs:
  deploy:
    name: Deploy frontend to S3 and CloudFront
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    permissions:
      contents: read
      id-token: write

    concurrency:
      group: ieee-frontend-production-deploy
      cancel-in-progress: false
      queue: max

    env:
      AWS_REGION: ap-northeast-2
      S3_BUCKET: ieee-hongik-frontend-015454941458
      DISTRIBUTION_ID: E3FJUV685123A4
      FRONTEND_DOMAIN: dm3mb697l7lxs.cloudfront.net

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-dist
          path: dist

      - name: Verify build artifact
        run: |
          test -s dist/index.html
          test -d dist/assets

      - name: Check current main commit
        shell: bash
        run: |
          LATEST_SHA=$(git ls-remote \
            "https://github.com/${GITHUB_REPOSITORY}.git" \
            refs/heads/main | cut -f1)

          if [ -z "$LATEST_SHA" ] || [ "$LATEST_SHA" != "$GITHUB_SHA" ]; then
            echo "::error::Deployment commit is not the latest main commit"
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::015454941458:role/IEEE-github-actions-frontend-role
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: '015454941458'
          role-session-name: ${{ github.run_id }}

      - name: Verify AWS account
        shell: bash
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity \
            --query Account --output text)

          test "$ACCOUNT_ID" = "015454941458"

      - name: Upload versioned assets
        run: |
          aws s3 sync dist/assets/ "s3://${S3_BUCKET}/assets/" \
            --cache-control "public,max-age=31536000,immutable" \
            --no-progress

      - name: Upload other static files
        run: |
          aws s3 sync dist/ "s3://${S3_BUCKET}/" \
            --exclude "index.html" \
            --exclude "assets/*" \
            --cache-control "public,max-age=300" \
            --no-progress

      - name: Check current main before publishing
        shell: bash
        run: |
          LATEST_SHA=$(git ls-remote \
            "https://github.com/${GITHUB_REPOSITORY}.git" \
            refs/heads/main | cut -f1)

          if [ -z "$LATEST_SHA" ] || [ "$LATEST_SHA" != "$GITHUB_SHA" ]; then
            echo "::error::Newer main commit detected"
            exit 1
          fi

      - name: Upload index.html
        run: |
          aws s3 cp dist/index.html "s3://${S3_BUCKET}/index.html" \
            --content-type "text/html; charset=utf-8" \
            --cache-control "no-cache,max-age=0,must-revalidate" \
            --no-progress

      - name: Invalidate CloudFront cache
        shell: bash
        run: |
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text)

          aws cloudfront wait invalidation-completed \
            --distribution-id "$DISTRIBUTION_ID" \
            --id "$INVALIDATION_ID"

      - name: Verify CloudFront response
        shell: bash
        run: |
          curl --fail --silent --show-error \
            --retry 3 \
            "https://${FRONTEND_DOMAIN}/" \
            --output /tmp/frontend-index.html

          if ! cmp -s dist/index.html /tmp/frontend-index.html; then
            echo "::error::CloudFront content does not match the deployed index.html"
            exit 1
          fi

          echo "CloudFront index.html verification passed"
